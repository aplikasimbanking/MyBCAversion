<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MyBCA Android - Simulasi M-Banking Pembelajaran</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        html, body {
            font-family: 'Inter', sans-serif;
            background-color: #F4F6F9;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        /* Tampilan Penuh Portrait tanpa bingkai atau status bar perangkat */
        #app-container {
            width: 100%;
            height: 100%;
            background-color: #F4F6F9;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        /* Pada layar sangat lebar (desktop), tetap tampil penuh tinggi secara portrait terpusat dengan halus */
        @media (min-width: 640px) {
            body {
                background-color: #cbd5e1;
                display: flex;
                justify-content: center;
            }
            #app-container {
                max-width: 480px;
                height: 100vh;
                box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
            }
        }
        /* Custom Scrollbar */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* Gradient Utama MyBCA */
        .bg-mybca-gradient {
            background: linear-gradient(135deg, #003B70 0%, #005A9C 60%, #0077CC 100%);
        }
        .bg-card-gradient {
            background: linear-gradient(120deg, #002B54 0%, #00529B 50%, #0284C7 100%);
        }
        /* Animasi Halus */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.25s ease-out forwards;
        }
    </style>
</head>
<body>

<div id="app-container">
    <!-- Toast / Custom Notification Modal (Pengganti Alert) -->
    <div id="toast-box" class="fixed top-5 left-1/2 transform -translate-x-1/2 z-50 hidden w-11/12 max-w-[420px] transition-all duration-300">
        <div id="toast-content" class="bg-slate-900 text-white px-4 py-3 rounded-2xl shadow-xl flex items-center gap-3 text-sm font-medium">
            <i data-lucide="info" class="w-5 h-5 text-sky-400 shrink-0"></i>
            <span id="toast-message">Pesan notifikasi</span>
        </div>
    </div>

    <!-- Custom Modal Dialog (Konfirmasi / Biometrik / PIN Admin) -->
    <div id="custom-modal" class="absolute inset-0 bg-slate-900/60 backdrop-blur-xs z-40 hidden flex items-center justify-center p-5">
        <div id="modal-body" class="bg-white w-full max-w-[400px] rounded-3xl p-6 shadow-2xl animate-fade-in">
            <!-- Konten modal dirender dinamis -->
        </div>
    </div>

    <!-- Main Screen Viewport -->
    <div id="screen-content" class="flex-1 flex flex-col overflow-hidden relative">
        <!-- Konten halaman dirender dinamis oleh JavaScript -->
    </div>

    <!-- Bottom Navigation Bar (Muncul hanya saat sudah login di halaman utama) -->
    <div id="bottom-nav" class="hidden bg-white border-t border-slate-200 px-2 py-2 pb-3 flex justify-around items-center z-20 shrink-0">
        <button onclick="navigate('home')" class="nav-btn flex flex-col items-center gap-1 p-1.5 text-slate-400 hover:text-[#003B70] transition" data-tab="home">
            <i data-lucide="home" class="w-5 h-5"></i>
            <span class="text-[10px] font-semibold">Beranda</span>
        </button>
        <button onclick="navigate('history')" class="nav-btn flex flex-col items-center gap-1 p-1.5 text-slate-400 hover:text-[#003B70] transition" data-tab="history">
            <i data-lucide="receipt" class="w-5 h-5"></i>
            <span class="text-[10px] font-semibold">Riwayat</span>
        </button>
        <button onclick="navigate('qris')" class="flex flex-col items-center -mt-6">
            <div class="w-14 h-14 rounded-full bg-mybca-gradient text-white flex items-center justify-center shadow-lg shadow-blue-900/30 border-4 border-white active:scale-95 transition">
                <i data-lucide="qr-code" class="w-6 h-6"></i>
            </div>
            <span class="text-[10px] font-bold text-[#003B70] mt-1">QRIS</span>
        </button>
        <button onclick="navigate('notifications')" class="nav-btn relative flex flex-col items-center gap-1 p-1.5 text-slate-400 hover:text-[#003B70] transition" data-tab="notifications">
            <i data-lucide="bell" class="w-5 h-5"></i>
            <span id="nav-notif-dot" class="hidden absolute top-1.5 right-2.5 w-2 h-2 bg-red-500 rounded-full"></span>
            <span class="text-[10px] font-semibold">Notifikasi</span>
        </button>
        <button onclick="navigate('account')" class="nav-btn flex flex-col items-center gap-1 p-1.5 text-slate-400 hover:text-[#003B70] transition" data-tab="account">
            <i data-lucide="user" class="w-5 h-5"></i>
            <span class="text-[10px] font-semibold">Akun</span>
        </button>
    </div>
</div>

<script>
/**
 * ============================================================================
 * MYBCA ANDROID - SIMULASI M-BANKING PEMBELAJARAN
 * ============================================================================
 * Fitur Lengkap:
 * 1. Tampilan Penuh Portrait tanpa status bar perangkat
 * 2. Onboarding 3 Slide Interaktif
 * 3. Login Bersih + Simulasi Biometrik + PIN Transaksi
 * 4. Panel Admin Rahasia (Ketuk 3x Logo MyBCA Android di Login -> PIN: 146700)
 * 5. Pendaftaran Bertahap 4 Langkah + Generate Rekening + Link WA Admin (085603659730)
 * 6. Transfer Real-Time cukup dengan mengetik Nomor Rekening (Auto-Lookup Data Penerima)
 * 7. Unduh e-Statement Asli (CSV / Laporan Cetak) secara real-time
 * 8. Pengaturan Limit Harian Kartu, Simpan Rekening Favorit, Pembayaran, TopUp, QRIS
 */

// Konstanta Konfigurasi Pembelajaran
const ADMIN_PIN = "146700";
const ADMIN_WA_NUMBER = "6285603659730";
const STORAGE_KEY = "mybca_android_sim_db_v2";

// State Aplikasi Global
let appState = {
    currentScreen: 'onboarding',
    onboardingStep: 0,
    registerStep: 1,
    registerDraft: {
        product: 'Tahapan BCA',
        fullName: '',
        birthInfo: '',
        phone: '',
        address: '',
        job: '',
        userId: '',
        password: '',
        pin: ''
    },
    registeredResult: null,
    currentUser: null,
    pendingLoginUser: null,
    showBalance: true,
    logoTapCount: 0,
    logoTapTimer: null,
    lastReceipt: null,
    estatementPeriod: '1 Bulan'
};

// Inisialisasi Database Lokal
function loadDatabase() {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
        const parsed = JSON.parse(raw);
        // Pastikan setiap user memiliki properti array favorites
        parsed.users.forEach(u => {
            if (!u.favorites) u.favorites = [];
            if (!u.cardLimit) u.cardLimit = 10000000;
        });
        return parsed;
    }
    const initialDB = {
        users: [
            {
                id: "usr-default-01",
                accountNumber: "8810293847",
                product: "Tahapan BCA",
                fullName: "Andhika Putra",
                birthInfo: "Semarang, 12 Mei 1998",
                phone: "081234567890",
                address: "Jl. Pemuda No. 10, Semarang",
                job: "Karyawan Swasta",
                userId: "andhika123",
                password: "123",
                pin: "123456",
                balance: 5000000,
                status: "ACTIVE",
                cardActive: true,
                cardLimit: 15000000,
                favorites: [],
                createdAt: new Date().toLocaleDateString('id-ID'),
                transactions: [
                    {
                        id: "TRX-9001",
                        type: "CREDIT",
                        category: "Transfer",
                        title: "Setoran Awal Rekening",
                        subtitle: "Pembukaan Rekening Baru",
                        amount: 5000000,
                        date: new Date().toLocaleDateString('id-ID') + ", 08:00"
                    }
                ],
                notifications: [
                    {
                        id: "NOTIF-1",
                        category: "Informasi",
                        title: "Selamat Datang di MyBCA Android",
                        message: "Aplikasi simulasi m-banking untuk keperluan pembelajaran siap digunakan.",
                        date: "Hari ini",
                        unread: true
                    }
                ]
            }
        ]
    };
    saveDatabase(initialDB);
    return initialDB;
}

function saveDatabase(db) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
}

function getFreshCurrentUser() {
    if (!appState.currentUser) return null;
    const db = loadDatabase();
    const updated = db.users.find(u => u.id === appState.currentUser.id);
    appState.currentUser = updated || null;
    return appState.currentUser;
}

// Utilitas Format Rupiah
function formatRupiah(num) {
    return "Rp " + Number(num || 0).toLocaleString('id-ID');
}

// Toast Notification Pengganti Alert()
function showToast(msg) {
    const toastBox = document.getElementById('toast-box');
    const toastMsg = document.getElementById('toast-message');
    toastMsg.textContent = msg;
    toastBox.classList.remove('hidden');
    setTimeout(() => {
        toastBox.classList.add('hidden');
    }, 3200);
}

// Modal Helper
function openModal(htmlContent) {
    const modal = document.getElementById('custom-modal');
    const body = document.getElementById('modal-body');
    body.innerHTML = htmlContent;
    modal.classList.remove('hidden');
    lucide.createIcons();
}

function closeModal() {
    document.getElementById('custom-modal').classList.add('hidden');
}

// Navigasi Utama
function navigate(screen, params = {}) {
    appState.currentScreen = screen;
    Object.assign(appState, params);
    render();
}

// ============================================================================
// LOGIKA RAHASIA PANEL ADMIN (TAP LOGO 3X -> PIN 146700)
// ============================================================================
function handleLogoTap() {
    appState.logoTapCount++;
    clearTimeout(appState.logoTapTimer);
    
    if (appState.logoTapCount >= 3) {
        appState.logoTapCount = 0;
        openAdminPinModal();
    } else {
        appState.logoTapTimer = setTimeout(() => {
            appState.logoTapCount = 0;
        }, 1200);
    }
}

function openAdminPinModal() {
    openModal(`
        <div class="text-center">
            <div class="w-12 h-12 bg-blue-50 text-[#003B70] rounded-2xl flex items-center justify-center mx-auto mb-3">
                <i data-lucide="shield-alert" class="w-6 h-6"></i>
            </div>
            <h3 class="text-lg font-bold text-slate-800">Akses Panel Admin</h3>
            <p class="text-xs text-slate-500 mt-1 mb-4">Masukkan 6-Digit PIN Otorisasi Admin</p>
            <input type="password" id="admin-pin-input" maxlength="6" inputmode="numeric" placeholder="••••••" 
                class="w-full text-center tracking-[0.5em] text-xl font-bold py-3 border border-slate-300 rounded-xl focus:outline-none focus:border-[#003B70] mb-4">
            <div class="flex gap-2">
                <button onclick="closeModal()" class="flex-1 py-2.5 rounded-xl border border-slate-200 text-slate-600 text-sm font-semibold">Batal</button>
                <button onclick="verifyAdminPin()" class="flex-1 py-2.5 rounded-xl bg-[#003B70] text-white text-sm font-semibold">Masuk Panel</button>
            </div>
        </div>
    `);
    setTimeout(() => document.getElementById('admin-pin-input')?.focus(), 100);
}

function verifyAdminPin() {
    const val = document.getElementById('admin-pin-input')?.value;
    if (val === ADMIN_PIN) {
        closeModal();
        showToast("Akses Panel Admin Diterima");
        navigate('admin_panel');
    } else {
        showToast("PIN Admin salah!");
    }
}

// ============================================================================
// RENDERER UTAMA PER HALAMAN
// ============================================================================
function render() {
    const container = document.getElementById('screen-content');
    const bottomNav = document.getElementById('bottom-nav');

    const mainTabs = ['home', 'history', 'qris', 'notifications', 'account'];
    if (appState.currentUser && mainTabs.includes(appState.currentScreen)) {
        bottomNav.classList.remove('hidden');
        document.querySelectorAll('.nav-btn').forEach(btn => {
            if (btn.dataset.tab === appState.currentScreen) {
                btn.classList.remove('text-slate-400');
                btn.classList.add('text-[#003B70]');
            } else {
                btn.classList.add('text-slate-400');
                btn.classList.remove('text-[#003B70]');
            }
        });
        const user = getFreshCurrentUser();
        const hasUnread = user?.notifications?.some(n => n.unread);
        const dot = document.getElementById('nav-notif-dot');
        if (hasUnread) dot.classList.remove('hidden');
        else dot.classList.add('hidden');
    } else {
        bottomNav.classList.add('hidden');
    }

    switch (appState.currentScreen) {
        case 'onboarding': container.innerHTML = renderOnboarding(); break;
        case 'login': container.innerHTML = renderLogin(); break;
        case 'pin_login': container.innerHTML = renderPinLogin(); break;
        case 'register': container.innerHTML = renderRegister(); break;
        case 'admin_panel': container.innerHTML = renderAdminPanel(); break;
        case 'home': container.innerHTML = renderHome(); break;
        case 'rekening': container.innerHTML = renderRekening(); break;
        case 'transfer': container.innerHTML = renderTransfer(); break;
        case 'payment': container.innerHTML = renderPayment(); break;
        case 'topup': container.innerHTML = renderTopUp(); break;
        case 'qris': container.innerHTML = renderQRIS(); break;
        case 'history': container.innerHTML = renderHistory(); break;
        case 'notifications': container.innerHTML = renderNotifications(); break;
        case 'account': container.innerHTML = renderAccount(); break;
        case 'estatement': container.innerHTML = renderEStatement(); break;
        case 'card_settings': container.innerHTML = renderCardSettings(); break;
        case 'investment': container.innerHTML = renderInvestment(); break;
        case 'help': container.innerHTML = renderHelp(); break;
        default: container.innerHTML = renderLogin();
    }

    lucide.createIcons();
}

// ----------------------------------------------------------------------------
// 1. ONBOARDING (3 SLIDE)
// ----------------------------------------------------------------------------
function renderOnboarding() {
    const slides = [
        {
            icon: 'wallet',
            title: 'Satu aplikasi untuk semua kebutuhan finansial',
            desc: 'Simulasi perbankan digital modern untuk pembelajaran alur transaksi, tabungan, dan manajemen saldo.',
            btn: 'Mulai'
        },
        {
            icon: 'shield-check',
            title: 'Transaksi lebih aman dengan berbagai fitur keamanan',
            desc: 'Dilengkapi simulasi User ID, PIN Transaksi 6-digit, Biometrik, serta kontrol pengaturan kartu.',
            btn: 'Lanjut'
        },
        {
            icon: 'send',
            title: 'Kelola keuangan lebih mudah dan praktis di MyBCA Android',
            desc: 'Uji coba pendaftaran nasabah baru hingga simulasi transfer real-time antar rekening.',
            btn: 'Mulai Sekarang'
        }
    ];
    const s = slides[appState.onboardingStep];

    return `
        <div class="flex-1 bg-mybca-gradient text-white flex flex-col justify-between p-6 overflow-y-auto no-scrollbar relative z-10">
            <div class="flex justify-end items-center pt-1 relative z-20">
                <button type="button" onclick="navigate('login')" class="text-xs font-semibold text-white/90 hover:text-white px-4 py-2 rounded-full bg-white/15 active:scale-95 transition cursor-pointer">Lewati</button>
            </div>

            <div class="text-center my-auto px-2 py-4">
                <div class="mb-6">
                    <h1 class="text-3xl font-extrabold tracking-tight italic">MyBCA <span class="text-sky-300 font-bold not-italic text-xl">Android</span></h1>
                </div>

                <div class="w-36 h-36 mx-auto bg-white/10 backdrop-blur-md rounded-3xl flex items-center justify-center border border-white/20 shadow-2xl mb-6">
                    <i data-lucide="${s.icon}" class="w-16 h-16 text-sky-200"></i>
                </div>

                <h2 class="text-lg font-bold leading-snug mb-2.5">${s.title}</h2>
                <p class="text-xs text-blue-100 leading-relaxed">${s.desc}</p>
            </div>

            <div class="pt-2 pb-4 relative z-20">
                <div class="flex justify-center gap-2 mb-5">
                    ${slides.map((_, i) => `
                        <button type="button" onclick="appState.onboardingStep=${i}; render();" class="h-2 rounded-full transition-all cursor-pointer ${i === appState.onboardingStep ? 'w-7 bg-white' : 'w-2.5 bg-white/40'}"></button>
                    `).join('')}
                </div>
                <button type="button" id="onboarding-next-btn" onclick="nextOnboarding()" class="w-full py-4 bg-white hover:bg-sky-50 text-[#003B70] font-extrabold rounded-full shadow-xl active:scale-95 transition text-sm cursor-pointer">
                    ${s.btn}
                </button>
            </div>
        </div>
    `;
}

function nextOnboarding() {
    if (appState.onboardingStep < 2) {
        appState.onboardingStep = Number(appState.onboardingStep) + 1;
        render();
    } else {
        navigate('login');
    }
}

// ----------------------------------------------------------------------------
// 2. HALAMAN LOGIN (BERSIH TANPA TULISAN AKUN DEMO) & AKSES PANEL ADMIN
// ----------------------------------------------------------------------------
function renderLogin() {
    return `
        <div class="flex-1 bg-mybca-gradient flex flex-col justify-between overflow-y-auto no-scrollbar">
            <!-- Header Logo (Ketuk 3x untuk Panel Admin) -->
            <div class="pt-12 pb-8 px-6 text-center text-white select-none">
                <div onclick="handleLogoTap()" class="inline-block cursor-pointer active:scale-95 transition">
                    <h1 class="text-3xl font-extrabold tracking-tight italic">MyBCA <span class="text-sky-300 font-bold not-italic text-xl">Android</span></h1>
                </div>
                <p class="text-sm text-blue-100 mt-4 font-medium">Halo, Selamat datang di MyBCA Android</p>
            </div>

            <!-- Form Card -->
            <div class="bg-[#F4F6F9] rounded-t-[32px] flex-1 p-6 flex flex-col justify-between shadow-2xl animate-fade-in">
                <div>
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 space-y-4">
                        <div>
                            <label class="text-xs font-semibold text-slate-500 block mb-1.5">BCA ID (User ID)</label>
                            <div class="relative">
                                <i data-lucide="user" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3.5"></i>
                                <input type="text" id="login-userid" placeholder="Masukkan User ID" 
                                    class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-[#003B70]">
                            </div>
                        </div>

                        <div>
                            <label class="text-xs font-semibold text-slate-500 block mb-1.5">Password</label>
                            <div class="relative">
                                <i data-lucide="lock" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3.5"></i>
                                <input type="password" id="login-password" placeholder="Masukkan Password" 
                                    class="w-full pl-10 pr-10 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-[#003B70]">
                                <button type="button" onclick="toggleLoginPass()" class="absolute right-3.5 top-3.5 text-slate-400">
                                    <i data-lucide="eye" class="w-4 h-4"></i>
                                </button>
                            </div>
                        </div>

                        <div class="flex justify-end items-center text-xs">
                            <button onclick="showToast('Hubungi Admin via WhatsApp untuk bantuan lupa password')" class="text-[#00529B] font-semibold">Lupa password?</button>
                        </div>

                        <button onclick="handleLoginSubmit()" class="w-full py-3 bg-[#00529B] hover:bg-[#003B70] text-white font-bold rounded-full shadow-md shadow-blue-900/20 transition text-sm">
                            Masuk
                        </button>
                    </div>

                    <!-- Login Biometrik -->
                    <div class="mt-6 text-center">
                        <button onclick="triggerBiometricModal()" class="inline-flex flex-col items-center gap-2 text-slate-600 hover:text-[#003B70] transition">
                            <span class="text-xs font-semibold text-[#00529B]">Login dengan biometrik</span>
                            <div class="w-14 h-14 rounded-2xl bg-white shadow-sm border border-slate-200 flex items-center justify-center text-[#003B70]">
                                <i data-lucide="fingerprint" class="w-8 h-8"></i>
                            </div>
                        </button>
                    </div>
                </div>

                <!-- Link Daftar Akun Baru -->
                <div class="text-center pt-6 pb-2">
                    <p class="text-xs text-slate-500">
                        Belum punya akun? 
                        <button onclick="startRegistration()" class="text-[#00529B] font-bold hover:underline ml-1">Daftar sekarang</button>
                    </p>
                    <p class="text-[10px] text-slate-400 mt-3">Aplikasi Simulasi Pembelajaran M-Banking</p>
                </div>
            </div>
        </div>
    `;
}

function toggleLoginPass() {
    const inp = document.getElementById('login-password');
    if (inp) inp.type = inp.type === 'password' ? 'text' : 'password';
}

function handleLoginSubmit() {
    const userId = document.getElementById('login-userid')?.value.trim();
    const password = document.getElementById('login-password')?.value.trim();

    if (!userId || !password) {
        showToast("Harap isi BCA ID dan Password!");
        return;
    }

    const db = loadDatabase();
    const foundUser = db.users.find(u => u.userId.toLowerCase() === userId.toLowerCase() && u.password === password);

    if (!foundUser) {
        showToast("BCA ID atau Password tidak sesuai!");
        return;
    }

    if (foundUser.status !== 'ACTIVE') {
        openModal(`
            <div class="text-center">
                <div class="w-12 h-12 bg-amber-50 text-amber-600 rounded-2xl flex items-center justify-center mx-auto mb-3">
                    <i data-lucide="clock" class="w-6 h-6"></i>
                </div>
                <h3 class="text-base font-bold text-slate-800">Akun Menunggu ACC Admin</h3>
                <p class="text-xs text-slate-500 mt-2 leading-relaxed">
                    Rekening <b>${foundUser.accountNumber}</b> a.n. <b>${foundUser.fullName}</b> berstatus <b>Pending</b>. Silakan konfirmasi ke Admin WhatsApp untuk aktivasi akun.
                </p>
                <div class="mt-4 space-y-2">
                    <a href="${buildWhatsAppLink(foundUser)}" target="_blank" class="block w-full py-2.5 bg-emerald-600 text-white rounded-xl text-xs font-bold">
                        Hubungi Admin WhatsApp (085603659730)
                    </a>
                    <button onclick="closeModal()" class="w-full py-2 text-slate-500 text-xs font-semibold">Tutup</button>
                </div>
            </div>
        `);
        return;
    }

    appState.pendingLoginUser = foundUser;
    navigate('pin_login');
}

function triggerBiometricModal() {
    const db = loadDatabase();
    const activeUsers = db.users.filter(u => u.status === 'ACTIVE');
    if (activeUsers.length === 0) {
        showToast("Belum ada akun aktif untuk biometrik.");
        return;
    }
    const targetUser = activeUsers[activeUsers.length - 1];
    openModal(`
        <div class="text-center py-2">
            <h3 class="text-base font-bold text-slate-800">Masuk dengan Biometrik</h3>
            <p class="text-xs text-slate-500 mt-1 mb-5">Sentuh sensor sidik jari untuk masuk sebagai <b>${targetUser.fullName}</b></p>
            <button onclick="completeBiometricLogin('${targetUser.id}')" class="w-20 h-20 rounded-full bg-blue-50 text-[#003B70] flex items-center justify-center mx-auto border-2 border-[#00529B] animate-pulse active:scale-90 transition">
                <i data-lucide="fingerprint" class="w-11 h-11"></i>
            </button>

function renderPinLogin() {

    return `

            <div>
                <button onclick="navigate('login')" class="p-2 -ml-2 text-slate-600 hover:text-[#003B70]">

                </button>
                <div class="text-center mt-6">
                    <h2 class="text-lg font-bold text-slate-800">Masukkan PIN MyBCA</h2>
                    <p class="text-xs text-slate-500 mt-1">Akun: <span class="font-semibold text-[#003B70]">${user.userId}</span></p>
                </div>

                <!-- Indikator 6 Titik PIN -->
                <div class="flex justify-center gap-3.5 my-8" id="pin-dots">
                    ${[0,1,2,3,4,5].map(i => `<div class="w-3.5 h-3.5 rounded-full border-2 border-[#003B70] pin-dot"></div>`).join('')}
                </div>
                <input type="hidden" id="pin-buffer" value="">
            </div>

            <!-- Keypad Numerik -->
            <div class="grid grid-cols-3 gap-3 pb-4">
                ${[1,2,3,4,5,6,7,8,9].map(num => `
                    <button onclick="pressPinKey('${num}')" class="h-14 rounded-2xl bg-slate-50 hover:bg-blue-50 active:bg-blue-100 text-xl font-bold text-slate-800 transition">
                        ${num}
                    </button>
                `).join('')}
                <div></div>
                <button onclick="pressPinKey('0')" class="h-14 rounded-2xl bg-slate-50 hover:bg-blue-50 active:bg-blue-100 text-xl font-bold text-slate-800 transition">0</button>
                <button onclick="backspacePinKey()" class="h-14 rounded-2xl bg-slate-50 hover:bg-red-50 text-slate-600 flex items-center justify-center transition">
                    <i data-lucide="delete" class="w-6 h-6"></i>
                </button>
            </div>
        </div>
    `;
}

function pressPinKey(digit) {
    const buf = document.getElementById('pin-buffer');
    if (!buf || buf.value.length >= 6) return;
    buf.value += digit;
    updatePinDots(buf.value.length);

    if (buf.value.length === 6) {
        setTimeout(() => {
            if (buf.value === appState.pendingLoginUser.pin) {
                appState.currentUser = appState.pendingLoginUser;
                appState.pendingLoginUser = null;
                showToast("Login Berhasil!");
                navigate('home');
            } else {
                showToast("PIN salah! Silakan coba lagi.");
                buf.value = "";
                updatePinDots(0);
            }
        }, 150);
    }
}

function backspacePinKey() {
    const buf = document.getElementById('pin-buffer');
    if (!buf) return;
    buf.value = buf.value.slice(0, -1);
    updatePinDots(buf.value.length);
}

function updatePinDots(len) {
    document.querySelectorAll('.pin-dot').forEach((dot, idx) => {
        if (idx < len) dot.classList.add('bg-[#003B70]');
        else dot.classList.remove('bg-[#003B70]');
    });
}

function saveStep2AndNext() {
    const fullName = document.getElementById('reg-fullname').value.trim();
    const birthInfo = document.getElementById('reg-birth').value.trim();
    const phone = document.getElementById('reg-phone').value.trim();
    const address = document.getElementById('reg-address').value.trim();
    const job = document.getElementById('reg-job').value;

    if (!fullName || !birthInfo || !phone || !address) {
        showToast("Harap lengkapi semua kolom data diri!");
        return;

    Object.assign(appState.registerDraft, { fullName, birthInfo, phone, address, job });
    appState.registerStep = 3;

function submitNewAccount() {
    const userId = document.getElementById('reg-userid').value.trim();
    const password = document.getElementById('reg-pass').value.trim();
    const pin = document.getElementById('reg-pin').value.trim();

    if (userId.length < 4 || userId.includes(' ')) {
        showToast("BCA ID minimal 4 karakter tanpa spasi!");
        return;
    }
    if (!password) {
        showToast("Password tidak boleh kosong!");
        return;
    }
    if (!/^\d{6}$/.test(pin)) {
        showToast("PIN Transaksi harus 6 digit angka!");
        return;
    }

    const db = loadDatabase();
    if (db.users.some(u => u.userId.toLowerCase() === userId.toLowerCase())) {
        showToast("BCA ID sudah digunakan, pilih yang lain!");
        return;
    }

    // Generate 10-digit nomor rekening unik
    const randomAcc = "88" + Math.floor(10000000 + Math.random() * 90000000).toString();

    const newUser = {
        id: "usr-" + Date.now(),
        accountNumber: randomAcc,
        product: appState.registerDraft.product,
        fullName: appState.registerDraft.fullName,
        birthInfo: appState.registerDraft.birthInfo,
        phone: appState.registerDraft.phone,
        address: appState.registerDraft.address,
        job: appState.registerDraft.job,
        userId,
        password,
        pin,
        balance: 0,
        status: "PENDING",
        cardActive: true,
        cardLimit: 10000000,
        favorites: [],
        createdAt: new Date().toLocaleDateString('id-ID'),
        transactions: [],
        notifications: [
            {
                id: "NOTIF-" + Date.now(),
                category: "Informasi",
                title: "Pendaftaran Berhasil",
                message: `Rekening ${randomAcc} berhasil dibuat dan menunggu persetujuan Admin.`,
                date: "Baru saja",
                unread: true
            }
        ]
    };

    db.users.push(newUser);
    saveDatabase(db);

    appState.registeredResult = newUser;
    appState.registerStep = 4;
    render();
}

    if (user) {

        user.notifications.unshift({
            id: "NOTIF-" + Date.now(),
            category: "Informasi",
            title: "Akun Telah Diaktifkan",
            message: "Selamat! Akun MyBCA Android Anda telah disetujui oleh Admin dan siap digunakan.",

            unread: true
        });
        saveDatabase(db);
        showToast(`Akun ${user.fullName} berhasil diaktifkan!`);
        render();
    }
}

function deleteUserAdmin(userId) {
    const db = loadDatabase();
    if (db.users.length <= 1) {
        showToast("Minimal harus menyisakan 1 akun di sistem.");

    db.users = db.users.filter(u => u.id !== userId);
    saveDatabase(db);
    showToast("Akun berhasil dihapus.");
    render();
}

                <button onclick="executeAdminBalance('${user.id}', 'SET')" class="flex-1 py-2.5 border border-[#003B70] text-[#003B70] rounded-xl text-xs font-bold">Set Saldo</button>
                <button onclick="executeAdminBalance('${user.id}', 'ADD')" class="flex-1 py-2.5 bg-[#003B70] text-white rounded-xl text-xs font-bold">+ Tambah Saldo</button>

function executeAdminBalance(userId, mode) {
    const amount = Number(document.getElementById('admin-topup-amount')?.value);
    if (isNaN(amount) || amount < 0 || (mode === 'ADD' && amount <= 0)) {
        showToast("Masukkan nominal saldo yang valid!");
        return;
    }
    const db = loadDatabase();
    const user = db.users.find(u => u.id === userId);
    if (user) {
        const nowStr = new Date().toLocaleDateString('id-ID') + ", " + new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
        if (mode === 'ADD') {
            user.balance += amount;
            user.transactions.unshift({
                id: "TRX-" + Date.now(),
                type: "CREDIT",
                category: "Transfer",
                title: "Setoran Tunai / Top Up Admin",
                subtitle: "Penambahan Saldo Rekening",
                amount: amount,
                date: nowStr
            });
            user.notifications.unshift({
                id: "NOTIF-" + Date.now(),
                category: "Transaksi",
                title: "Saldo Masuk Berhasil",
                message: `Rekening ${user.accountNumber} menerima penambahan saldo sebesar ${formatRupiah(amount)}.`,
                date: nowStr,
                unread: true
            });
            showToast(`Berhasil menambah ${formatRupiah(amount)}`);
        } else {
            user.balance = amount;
            user.transactions.unshift({
                id: "TRX-" + Date.now(),
                type: "CREDIT",
                category: "Transfer",
                title: "Penyesuaian Saldo Admin",
                subtitle: "Update Saldo Rekening",
                amount: amount,
                date: nowStr
            });
            showToast(`Saldo diatur menjadi ${formatRupiah(amount)}`);
        }
        saveDatabase(db);
        closeModal();
        render();
    }
}

// Pencarian Otomatis Pemilik Rekening Saat User Mengetik Nomor Rekening
function checkTargetAccount() {
    const acc = document.getElementById('tf-acc')?.value.trim();
    const card = document.getElementById('tf-lookup-card');
    if (!card) return;

    if (!acc || acc.length < 4) {
        card.classList.add('hidden');
        return;
    }

    const db = loadDatabase();
    const currentUser = getFreshCurrentUser();

    if (acc === currentUser.accountNumber) {
        card.className = "mt-2.5 p-3 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-xs";
        card.innerHTML = `<b>Tidak Valid:</b> Anda tidak dapat mentransfer ke rekening Anda sendiri.`;
        card.classList.remove('hidden');
        return;
    }

    // Cari di seluruh database pengguna berdasarkan nomor rekening (termasuk akun baru maupun akun aktif)
    const found = db.users.find(u => u.accountNumber === acc);

    if (found) {
        card.className = "mt-2.5 p-3.5 rounded-xl bg-emerald-50 border border-emerald-200 text-slate-800 animate-fade-in";
        card.innerHTML = `
            <div class="flex items-center justify-between">
                <div>
                    <span class="text-[10px] font-bold text-emerald-700 uppercase tracking-wider">Rekening Ditemukan</span>
                    <p class="text-sm font-extrabold text-slate-900 mt-0.5">${found.fullName}</p>
                    <p class="text-[11px] text-slate-600">${found.product} • ${found.accountNumber}</p>
                </div>
                <div class="w-8 h-8 rounded-full bg-emerald-600 text-white flex items-center justify-center font-bold text-xs">
                    ✓
                </div>
            </div>
        `;
        card.classList.remove('hidden');
    } else {
        card.className = "mt-2.5 p-3 rounded-xl bg-slate-100 border border-slate-200 text-slate-500 text-xs";
        card.innerHTML = `Nomor rekening belum terdaftar di sistem MyBCA Android.`;
        card.classList.remove('hidden');
    }
}

function saveToFavorites(acc, name) {
    const db = loadDatabase();
    const user = db.users.find(u => u.id === appState.currentUser.id);
    if (user) {
        if (!user.favorites) user.favorites = [];
        if (!user.favorites.some(f => f.accountNumber === acc)) {
            user.favorites.push({ accountNumber: acc, name });
            saveDatabase(db);
            showToast("Rekening disimpan ke Daftar Favorit!");
            render();
        }
    }
}

function confirmTransferModal() {
    const user = getFreshCurrentUser();
    if (!user.cardActive) {
        showToast("Kartu/Rekening Anda sedang dinonaktifkan di Pengaturan Kartu!");
        return;
    }
    const targetAcc = document.getElementById('tf-acc')?.value.trim();
    const amount = Number(document.getElementById('tf-amount')?.value);
    const note = document.getElementById('tf-note')?.value.trim();

    if (!targetAcc || targetAcc === user.accountNumber) {
        showToast("Nomor rekening tujuan tidak valid!");
        return;
    }

    const db = loadDatabase();
    const receiver = db.users.find(u => u.accountNumber === targetAcc);

    if (!receiver) {
        showToast("Nomor rekening tujuan tidak ditemukan!");
        return;
    }

    if (!amount || amount < 1000) {
        showToast("Nominal transfer minimal Rp 1.000!");
        return;
    }
    if (amount > user.cardLimit) {
        showToast(`Nominal melebihi limit transaksi harian (${formatRupiah(user.cardLimit)})!`);
        return;
    }
    if (amount > user.balance) {
        showToast("Saldo tidak mencukupi!");
        return;
    }

    openModal(`
        <div>
            <h3 class="text-base font-bold text-slate-800 text-center">Konfirmasi Transfer</h3>
            <div class="bg-slate-50 p-3.5 rounded-2xl my-3 space-y-2 text-xs">
                <div class="flex justify-between"><span class="text-slate-400">Nama Penerima</span><b class="text-slate-800">${receiver.fullName}</b></div>
                <div class="flex justify-between"><span class="text-slate-400">No. Rekening</span><b class="font-mono">${receiver.accountNumber}</b></div>
                <div class="flex justify-between"><span class="text-slate-400">Produk</span><span>${receiver.product}</span></div>
                <div class="flex justify-between"><span class="text-slate-400">Nominal</span><b class="text-[#003B70] text-sm">${formatRupiah(amount)}</b></div>
            </div>
            <label class="text-xs font-semibold text-slate-600 block mb-1 text-center">Masukkan 6-Digit PIN Transaksi</label>
            <input type="password" id="confirm-tx-pin" maxlength="6" inputmode="numeric" placeholder="••••••" 
                class="w-full text-center tracking-[0.5em] text-lg font-bold py-2.5 border border-slate-300 rounded-xl mb-4">
            <div class="flex gap-2">
                <button onclick="closeModal()" class="flex-1 py-2.5 border border-slate-200 rounded-xl text-xs font-semibold">Batal</button>
                <button onclick="executeTransfer('${receiver.accountNumber}', ${amount}, '${note.replace(/'/g, "")}')" 
                    class="flex-1 py-2.5 bg-[#00529B] text-white rounded-xl text-xs font-bold">Kirim Sekarang</button>
            </div>
        </div>
    `);
}

function executeTransfer(targetAcc, amount, note) {
    const pinInput = document.getElementById('confirm-tx-pin')?.value;
    const db = loadDatabase();
    const sender = db.users.find(u => u.id === appState.currentUser.id);
    const receiver = db.users.find(u => u.accountNumber === targetAcc);

    if (!sender || !receiver) {
        showToast("Terjadi kesalahan data rekening!");
        return;
    }

    if (pinInput !== sender.pin) {
        showToast("PIN Transaksi salah!");
        return;
    }

    const nowDate = new Date().toLocaleDateString('id-ID');
    const nowTime = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
    const fullTimestamp = `${nowDate}, ${nowTime}`;
    const refId = "REF" + Date.now().toString().slice(-8);

    // 1. Kurangi saldo pengirim & catat mutasi DEBIT
    sender.balance = Number(sender.balance) - Number(amount);
    sender.transactions.unshift({
        id: "TRX-" + Date.now(),
        type: "DEBIT",
        category: "Transfer",
        title: `Transfer ke ${receiver.fullName}`,
        subtitle: note || `Rek: ${receiver.accountNumber}`,
        amount: Number(amount),
        date: fullTimestamp
    });
    sender.notifications.unshift({
        id: "NOTIF-" + Date.now(),
        category: "Transaksi",
        title: "Transfer Berhasil",
        message: `Transfer sebesar ${formatRupiah(amount)} ke ${receiver.fullName} (${receiver.accountNumber}) berhasil.`,
        date: fullTimestamp,
        unread: true
    });

    // 2. Tambahkan saldo penerima secara REAL-TIME & catat mutasi CREDIT + Notifikasi
    receiver.balance = Number(receiver.balance) + Number(amount);
    receiver.transactions.unshift({
        id: "TRX-" + (Date.now() + 1),
        type: "CREDIT",
        category: "Transfer",
        title: `Transfer dari ${sender.fullName}`,
        subtitle: note || `Rek: ${sender.accountNumber}`,
        amount: Number(amount),
        date: fullTimestamp
    });
    receiver.notifications.unshift({
        id: "NOTIF-" + (Date.now() + 1),
        category: "Transaksi",
        title: "Dana Masuk Rekening",
        message: `Anda menerima transfer sebesar ${formatRupiah(amount)} dari ${sender.fullName} (${sender.accountNumber}).`,
        date: fullTimestamp,
        unread: true
    });

    saveDatabase(db);
    closeModal();
    appState.lastReceipt = {
        targetName: receiver.fullName,
        targetAccount: receiver.accountNumber,
        amount: Number(amount),
        note,
        refId,
        isInternal: true,
        date: `${fullTimestamp} WIB`
    };
    render();
}

function executeBillPayment(serviceName, category) {
    const num = document.getElementById('bill-number')?.value.trim();
    const amount = Number(document.getElementById('bill-amount')?.value);
    const pin = document.getElementById('bill-pin')?.value;

    const db = loadDatabase();
    const user = db.users.find(u => u.id === appState.currentUser.id);

    if (!user.cardActive) {
        showToast("Kartu sedang dinonaktifkan!");
        return;
    }
    if (!num || amount <= 0) {
        showToast("Lengkapi nomor tujuan dan nominal!");
        return;
    }
    if (pin !== user.pin) {
        showToast("PIN Transaksi salah!");
        return;
    }
    if (amount > user.balance) {
        showToast("Saldo tidak mencukupi!");
        return;
    }

    const nowStr = new Date().toLocaleDateString('id-ID') + ", " + new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
    user.balance -= amount;
    user.transactions.unshift({
        id: "TRX-" + Date.now(),
        type: "DEBIT",
        category: category,
        title: `${category} ${serviceName}`,
        subtitle: `No: ${num}`,
        amount: amount,
        date: nowStr
    });
    user.notifications.unshift({
        id: "NOTIF-" + Date.now(),
        category: "Transaksi",
        title: `${category} ${serviceName} Berhasil`,
        message: `Transaksi sebesar ${formatRupiah(amount)} untuk ${num} telah berhasil.`,
        date: nowStr,
        unread: true
    });

    saveDatabase(db);
    closeModal();
    appState.lastReceipt = {
        targetName: `${category} ${serviceName}`,
        targetAccount: num,
        amount,
        note: 'Pembayaran Digital',
        refId: "PAY" + Date.now().toString().slice(-7),
        isInternal: false,
        date: `${nowStr} WIB`
    };
    navigate('transfer');
}

}

// Fungsi Unduh File CSV Asli ke Perangkat
function downloadRealEStatementCSV() {
    const user = getFreshCurrentUser();
    let csvRows = [
        ["LAPORAN E-STATEMENT MYBCA ANDROID (SIMULASI PEMBELAJARAN)"],
        ["Nama Nasabah", user.fullName],
        ["Nomor Rekening", `'${user.accountNumber}`],
        ["Jenis Tabungan", user.product],
        ["Periode", appState.estatementPeriod],
        ["Saldo Akhir", user.balance],
        [],
        ["ID Transaksi", "Tanggal & Waktu", "Kategori", "Keterangan", "Detail", "Tipe", "Nominal (Rp)"]
    ];

    user.transactions.forEach(t => {
        csvRows.push([
            t.id,
            `"${t.date}"`,
            t.category,
            `"${t.title}"`,
            `"${t.subtitle}"`,
            t.type === 'CREDIT' ? 'Uang Masuk (CR)' : 'Uang Keluar (DB)',
            t.amount
        ]);
    });

    const csvContent = "\uFEFF" + csvRows.map(e => e.join(",")).join("\n");
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.setAttribute("href", url);
    link.setAttribute("download", `eStatement_${user.accountNumber}_${Date.now()}.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
    showToast("File e-Statement (.CSV) berhasil diunduh!");
}
